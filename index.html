<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Azam's Aesthetic Avenue | Connect With Us</title>
    <meta name="description" content="Connect with Azam's Aesthetic Avenue on Instagram and WhatsApp, leave a Google review, or get directions." />
    <meta name="theme-color" content="#060504" />
    <meta property="og:title" content="Azam's Aesthetic Avenue" />
    <meta property="og:description" content="Tap to connect with us: Instagram, WhatsApp, reviews and directions." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/logo.png" />
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="veins" aria-hidden="true"></div>

    <main class="page">
      <div class="frame">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

        <!-- ================= BRAND ================= -->
        <header class="brand">
          <img
            class="brand-logo"
            src="assets/logo.png"
            alt="Azam's Aesthetic Avenue monogram"
            data-fallback="AA"
            width="176"
            height="152"
          />
          <h1 class="brand-name" aria-label="Azam's Aesthetic Avenue">
            <img
              class="name-top"
              src="assets/azams.png"
              alt=""
              data-fallback="Azam's"
              width="302"
              height="98"
            />
            <img
              class="name-main"
              src="assets/aesthetic-avenue.png"
              alt=""
              data-fallback="Aesthetic Avenue"
              width="629"
              height="95"
            />
          </h1>
          <p class="category"><span>Luxury Menswear</span></p>
        </header>

        <!-- ================= LINKS ================= -->
        <section class="connect" aria-labelledby="connect-title">
          <h2 id="connect-title" class="connect-title">
            Connect
            <small>with us</small>
          </h2>

          <!-- =====================================================
               EDIT THE href="#" VALUES BELOW TO ADD YOUR LINKS
               ===================================================== -->
          <div class="links">
            <!-- Instagram -->
            <a class="link" href="https://www.instagram.com/aestheticavenue2026" target="_blank" rel="noopener noreferrer">
              <span class="link-icon">
                <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
                  <defs>
                    <linearGradient id="ig-grad" x1="4" y1="28" x2="28" y2="4" gradientUnits="userSpaceOnUse">
                      <stop offset="0%" stop-color="#F58529" />
                      <stop offset="35%" stop-color="#DD2A7B" />
                      <stop offset="70%" stop-color="#8134AF" />
                      <stop offset="100%" stop-color="#515BD4" />
                    </linearGradient>
                  </defs>
                  <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#ig-grad)" />
                  <rect x="7.5" y="7.5" width="17" height="17" rx="5" stroke="#fff" stroke-width="2.1" />
                  <circle cx="16" cy="16" r="4.1" stroke="#fff" stroke-width="2.1" />
                  <circle cx="21.4" cy="10.6" r="1.3" fill="#fff" />
                </svg>
              </span>
              <span class="link-text">
                <span class="link-label">Instagram</span>
                <span class="link-sub">@aestheticavenue2026</span>
              </span>
              <span class="link-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10" /><path d="M7 17 17 7" /></svg></span>
            </a>

            <!-- WhatsApp Channel -->
            <a class="link" href="https://chat.whatsapp.com/Ht3GTEl6SOF1Xk1bIWQMPc" target="_blank" rel="noopener noreferrer">
              <span class="link-icon">
                <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
                  <rect x="2" y="2" width="28" height="28" rx="8" fill="#25D366" />
                  <path d="M16.02 6.6a9.37 9.37 0 0 0-8.05 14.1L6.7 25.3l4.7-1.23a9.37 9.37 0 1 0 4.62-17.47Z" stroke="#fff" stroke-width="1.9" stroke-linejoin="round" />
                  <path d="M12.6 11.3c-.3-.6-.6-.6-.9-.6h-.7c-.25 0-.65.1-1 .47-.33.37-1.3 1.27-1.3 3.1s1.33 3.6 1.5 3.84c.18.25 2.6 4.1 6.42 5.6 3.18 1.25 3.82 1 4.5.94.7-.06 2.2-.9 2.5-1.77.3-.87.3-1.6.2-1.77-.1-.16-.35-.25-.72-.44-.37-.18-2.2-1.08-2.54-1.2-.34-.13-.58-.19-.83.18-.25.37-.96 1.2-1.18 1.45-.22.25-.43.28-.8.1-.37-.18-1.57-.58-2.98-1.84-1.1-.98-1.84-2.2-2.06-2.57-.22-.37-.02-.57.16-.75.17-.16.37-.43.55-.65.19-.21.25-.37.37-.62.13-.25.06-.46-.03-.65-.1-.18-.82-1.98-1.13-2.7Z" fill="#fff" transform="translate(.6 -3.6) scale(.82)" />
                </svg>
              </span>
              <span class="link-text">
                <span class="link-label">Join our WhatsApp Channel</span>
              </span>
              <span class="link-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10" /><path d="M7 17 17 7" /></svg></span>
            </a>

            <!-- Google Review -->
            <a class="link" href="https://search.google.com/local/writereview?placeid=ChIJx4yyFQCZyzsRFgrB6Va1tCc" target="_blank" rel="noopener noreferrer">
              <span class="link-icon">
                <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
                  <rect x="2" y="2" width="28" height="28" rx="8" fill="#0B0B0B" stroke="#3A3A3A" />
                  <path d="M16 6.4l2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L16 6.4Z" fill="#FBBC05" stroke="#F59E0B" stroke-width="0.9" stroke-linejoin="round" />
                </svg>
              </span>
              <span class="link-text">
                <span class="link-label">Google Review</span>
                <span class="link-sub">Rate your visit</span>
              </span>
              <span class="link-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10" /><path d="M7 17 17 7" /></svg></span>
            </a>

            <!-- Google Directions -->
            <a class="link" href="https://maps.app.goo.gl/JRjJPWSeZXxqsZ356" target="_blank" rel="noopener noreferrer">
              <span class="link-icon">
                <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
                  <path d="M16 3C10.5 3 6 7.4 6 12.9c0 6.7 8.4 15.1 9.4 16 .3.3.9.3 1.2 0 1-.9 9.4-9.3 9.4-16C26 7.4 21.5 3 16 3Z" fill="#4285F4" />
                  <path d="M16 3c-5.5 0-10 4.4-10 9.9 0 2.2.7 4.5 2 6.7l8-6.7V3Z" fill="#EA4335" />
                  <path d="M8 19.6c1.9 3.2 4.7 6.3 6.7 8.3l1.3-15-8 6.7Z" fill="#FBBC04" />
                  <path d="M16 12.9v16c.2 0 .4-.1.6-.2 1-.9 9.4-9.3 9.4-16 0-3-.9-5.7-2.4-7.8l-7.6 8Z" fill="#34A853" />
                  <circle cx="16" cy="12.6" r="4.1" fill="#fff" />
                </svg>
              </span>
              <span class="link-text">
                <span class="link-label">Google Directions</span>
                <span class="link-sub">Find us on Maps</span>
              </span>
              <span class="link-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10" /><path d="M7 17 17 7" /></svg></span>
            </a>

            <!-- Call (phone number). When adding the link use: tel:+91XXXXXXXXXX -->
            <a class="link link-call" href="tel:+919704961366">
              <span class="link-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z" />
                </svg>
              </span>
              <span class="link-text">
                <span class="link-label">Call Us</span>
                <span class="link-sub">+91 97049 61366</span>
              </span>
              <span class="link-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10" /><path d="M7 17 17 7" /></svg></span>
            </a>
          </div>
        </section>

        <footer class="foot">
          <span class="foot-line" aria-hidden="true"></span>
          <p>&copy; 2026 Azam's Aesthetic Avenue</p>
        </footer>
      </div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="js/main.js" defer></script>
  </body>
</html>
